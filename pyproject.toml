[project]
name = "trainwright"
version = "0.3.0"
description = "An agent-first PyTorch framework for training small, task-specific models with a disciplined ML lifecycle: profile, split, baseline, train, diagnose, evaluate, export, serve."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Devon Copp" }]
requires-python = ">=3.10"
keywords = ["pytorch", "machine-learning", "agents", "llm", "mlops", "experiment-tracking", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=2.0",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.8",
    "pyarrow>=15",
]

[project.optional-dependencies]
vision = ["torchvision>=0.17", "pillow>=10.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
mcp = ["mcp>=1.2"]
all = ["trainwright[vision,serve,onnx,mcp,label,text]"]
label = [
    "anthropic>=1.0",
]
text = [
    "tokenizers>=0.19",
    "transformers>=4.44",
]

[project.scripts]
trainwright = "trainwright.cli:main"

[project.urls]
Homepage = "https://github.com/djcopp/trainwright"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501", "B905", "RUF046", "RUF015", "RUF005", "RUF007", "RUF043", "SIM102", "SIM105", "SIM108", "UP031"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
