name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch)
        run: uv sync --all-extras
        env:
          UV_TORCH_BACKEND: cpu
      - name: Lint
        run: uv run ruff check src tests bench examples && uv run ruff format --check src tests bench examples
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
